[paths]
state_db_path = .data/state.db
deadletter_path = .data/deadletter.jsonl

[github]
gh_bin = gh
repo_query = (evm OR ethereum OR solidity OR solc OR foundry OR forge OR cast OR hardhat OR truffle OR ethers OR viem OR wagmi OR metamask OR openzeppelin OR uniswap OR aave OR chainlink OR flashbots OR mev OR erc20 OR erc721 OR erc1155) OR (solana OR "@solana/web3.js" OR solana-sdk OR solana_sdk:: OR anchor OR anchor-lang OR anchor_lang:: OR spl-token OR token-2022 OR raydium OR jupiter) archived:false fork:false is:public
repo_pushed_days = 7
repos_per_run = 30
per_repo_code_hits = 10

[ecosystem]
dependency_files = package.json,requirements.txt,pyproject.toml,Cargo.toml,go.mod
ethereum_markers = ethers,viem,web3,web3.py,go-ethereum,ethers::,alloy
solana_markers = @solana/web3.js,solana-sdk,solana_sdk::,anchor-lang,anchor_lang::,anchorpy,solders

[scan]
leak_terms = mnemonic,seed phrase,seedphrase,xprv,private key,secret key,solana secret key,PRIVATE_KEY,SECRET_KEY,MNEMONIC,SEED_PHRASE,WALLET_PRIVATE_KEY,DEPLOYER_PRIVATE_KEY,OWNER_PRIVATE_KEY,ADMIN_PRIVATE_KEY,SOLANA_PRIVATE_KEY

[rate]
min_interval_sec = 1.2
jitter_sec = 0.8
max_calls_per_minute = 40
backoff_base_sec = 2
backoff_max_sec = 120
backoff_max_retries = 5

[notion]
ntn_bin = ntn
database_id =
default_status = 待复核

prop_repo_url = Repo URL
prop_file_url = File URL
prop_file_path = File Path
prop_term = Term
prop_snippet = Snippet (Masked)
prop_ecosystem = Ecosystem
prop_blob_sha = Blob SHA
prop_status = Status
prop_first_seen = First Seen
prop_last_seen = Last Seen
prop_hit_count = Hit Count
prop_dedup_key = Dedup Key
prop_title = Title
prop_notes = Notes
prop_tags = Tags
